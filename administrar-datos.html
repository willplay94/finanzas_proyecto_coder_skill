<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Script administrar datos -->
    <script defer src="./script/administrar-datos.js"></script>
    <title>Calculos - Finanzas Personales</title>
    <!-- Fuente Merriweather -->
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap"
        rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="./style/style.css">
</head>

<body>
    <!-- Barra de navegacion -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="./index.html">Finanzas personales</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="./index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="./administrar-datos.html">Administrar datos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Titulo principal -->
    <h1 class="mb-4">Administrar datos</h1>

    <!-- Caja de busqueda -->
    <section id="busquedaDatos">
        <h2>Busqueda de datos</h2>
        <form class="d-flex" role="search">
            <input id="cajaBusqueda" class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
            <button id="botonBusqueda" class="btn btn-outline-success" type="submit">Search</button>
        </form>
    </section>

    <!-- Tabla de datos almacenados -->
    <section id="datosAlmacenadosSeccion">
        <h2>Datos almacenados</h2>
        <div id="renderDatosAlmacenados">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">id</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Categoría</th>
                        <th scope="col">Monto</th>
                        <th scope="col">Tipo de dato</th>
                    </tr>
                </thead>
                <tbody id="datosAlmacenados"></tbody>
            </table>
        </div>
    </section>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
